<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>音符撒尽人间</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0d;
            color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .hero {
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.65)
                ),
                url("hero.jpg");

            background-size: cover;
            background-position: center;

            position: relative;
        }
        
        .hero::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    transparent 20%,
                    rgba(0, 0, 0, 0.35) 100%
                );

            pointer-events: none;
        }
        
        .hero h1 {

            position: relative;
            z-index: 1;
            
            font-size: 64px;
            font-weight: 300;
            letter-spacing: 8px;
        }

        .hero p {
            
            position: relative;
            z-index: 1;
            
            margin-top: 20px;
            color: #888;
            letter-spacing: 4px;
        }

        .enter {
            
            position: relative;
            z-index: 1;
            
            margin-top: 50px;

            padding: 12px 30px;

            border: 1px solid #555;
            color: #eee;

            text-decoration: none;

            transition: 0.3s;
        }

        .enter:hover {
            background: #eee;
            color: #111;
        }
        /* 黑屏过渡层 */

        .transition {
            position: fixed;
            inset: 0;
        
            background: #050505;
        
            display: flex;
            justify-content: center;
            align-items: center;
        
            opacity: 0;
            visibility: hidden;
        
            z-index: 9999;
        
            transition:
                opacity 1.5s ease,
                visibility 1.5s ease;
        }
        
        
        /* 黑屏出现 */
        
        .transition.active {
            opacity: 1;
            visibility: visible;
        }
        
        
        /* 那句话 */
        
        .explore-text {
            color: #eeeeee;
        
            font-family: Georgia, serif;
        
            font-size: 28px;
        
            letter-spacing: 6px;
        
            opacity: 0;
        
            animation: none;
        }
        
        
        /* 文字淡入淡出 */
        
        .transition.active .explore-text {
            animation: explore 5s ease forwards;
        }
        
        
        @keyframes explore {
        
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
        
            25% {
                opacity: 1;
                transform: translateY(0);
            }
        
            70% {
                opacity: 1;
                transform: translateY(0);
            }
        
            100% {
                opacity: 0;
                transform: translateY(-10px);
            }
        
        }

    </style>
</head>

<script>

    const enterButton = document.getElementById("enterButton");
    const transition = document.getElementById("transition");

    enterButton.addEventListener("click", () => {

        transition.classList.add("active");

    });

</script>
    
<body>

    <section class="hero">

        <h1>音符撒尽人间</h1>

        <p>Music · Photography · Travel</p>

        <button class="enter" id="enterButton">
            进入
        </button>

        <div class="transition" id="transition">
            <div class="explore-text">
                You are free to explore.
            </div>
        </div>

    </section>


    <section id="about">

        <h2>关于我</h2>

        <p>
            用音乐记录情绪，
            用镜头记录远方。
        </p>

    </section>

</body>

</html>
