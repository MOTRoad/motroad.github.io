<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>音符撒尽人间</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0d;
            color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .hero {
            height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.45),
                    rgba(0, 0, 0, 0.65)
                ),
                url("hero.jpg");

            background-size: cover;
            background-position: center;

            position: relative;
        }
        
        .hero::after {
            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    transparent 20%,
                    rgba(0, 0, 0, 0.35) 100%
                );

            pointer-events: none;
        }
        
        .hero h1 {

            position: relative;
            z-index: 1;
            
            font-size: 64px;
            font-weight: 300;
            letter-spacing: 8px;
        }

        .hero p {
            
            position: relative;
            z-index: 1;
            
            margin-top: 20px;
            color: #888;
            letter-spacing: 4px;
        }

        .enter {
            
            position: relative;
            z-index: 1;
            
            margin-top: 50px;

            padding: 12px 30px;

            border: 1px solid #555;
            color: #eee;

            text-decoration: none;

            transition: 0.3s;
        }

        .enter:hover {
            background: #eee;
            color: #111;
        }

    </style>
</head>


<body>

    <section class="hero">

        <h1>音符撒尽人间</h1>

        <p>Music · Photography · Travel</p>

        <a class="enter" href="#about">
            进入
        </a>

    </section>


    <section id="about">

        <h2>关于我</h2>

        <p>
            用音乐记录情绪，
            用镜头记录远方。
        </p>

    </section>

</body>

</html>
